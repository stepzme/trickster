<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" role="img" aria-labelledby="title desc">
  <title id="title">Trickster agent roles and responsibilities</title>
  <desc id="desc">The master orchestrates five focused roles: product researcher, design planner, implementation owner, visual producer, and acceptance reviewer.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1280" height="840" rx="36" fill="#F5F2EA"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="72" fill="#11100F" font-size="38" font-weight="760" letter-spacing="-1.2">A focused team, directed by one master</text>
    <text x="64" y="108" fill="#6D6961" font-size="20">Each role owns a narrow outcome. The master owns the product.</text>

    <g fill="none" stroke="#B0ABA1" stroke-width="3" stroke-linecap="round">
      <path d="M640 292V339H250V379"/>
      <path d="M640 339H640V379"/>
      <path d="M640 339H1030V379"/>
      <path d="M640 339V605H445V645"/>
      <path d="M640 605H835V645"/>
    </g>
    <g fill="#B0ABA1">
      <circle cx="640" cy="339" r="7"/>
      <circle cx="640" cy="605" r="7"/>
    </g>

    <g filter="url(#shadow)">
      <rect x="372" y="146" width="536" height="146" rx="28" fill="#11100F"/>
      <rect x="64" y="379" width="372" height="178" rx="24" fill="#FFFFFF"/>
      <rect x="454" y="379" width="372" height="178" rx="24" fill="#FFFFFF"/>
      <rect x="844" y="379" width="372" height="178" rx="24" fill="#FFFFFF"/>
      <rect x="259" y="645" width="372" height="150" rx="24" fill="#FFFFFF"/>
      <rect x="649" y="645" width="372" height="150" rx="24" fill="#FFFFFF"/>
    </g>

    <path transform="translate(411 202) scale(.45)" fill="#DFFF4F" d="M82 8C84 42 93 51 132 43C104 62 103 72 140 91C101 80 92 88 102 132C81 96 70 94 43 128C61 89 53 80 12 76C53 66 59 54 37 18C68 45 78 41 82 8Z"/>
    <text x="518" y="205" fill="#DFFF4F" font-size="15" font-weight="760" letter-spacing="2">MASTER</text>
    <text x="518" y="239" fill="#FAF8F2" font-size="27" font-weight="740">Orchestrates the whole run</text>
    <text x="518" y="268" fill="#B9B5AC" font-size="17">User gates · ownership · handoffs · final decisions</text>

    <g font-size="14" font-weight="760" letter-spacing="1.5">
      <rect x="88" y="403" width="44" height="8" rx="4" fill="#B79CFF"/>
      <text x="88" y="444" fill="#6D6961">PRODUCT RESEARCHER</text>
      <rect x="478" y="403" width="44" height="8" rx="4" fill="#6FD8C2"/>
      <text x="478" y="444" fill="#6D6961">DESIGN PLANNER</text>
      <rect x="868" y="403" width="44" height="8" rx="4" fill="#FFB25B"/>
      <text x="868" y="444" fill="#6D6961">IMPLEMENTATION OWNER</text>
      <rect x="283" y="669" width="44" height="8" rx="4" fill="#FF6B4A"/>
      <text x="283" y="710" fill="#6D6961">VISUAL PRODUCER</text>
      <rect x="673" y="669" width="44" height="8" rx="4" fill="#11100F"/>
      <text x="673" y="710" fill="#6D6961">ACCEPTANCE REVIEWER</text>
    </g>

    <g fill="#11100F" font-size="24" font-weight="735">
      <text x="88" y="482">Defines the boundaries</text>
      <text x="478" y="482">Turns intent into a contract</text>
      <text x="868" y="482">Builds the agreed product</text>
      <text x="283" y="748">Creates product-facing assets</text>
      <text x="673" y="748">Proves the final build</text>
    </g>
    <g fill="#6D6961" font-size="17">
      <text x="88" y="516">Users · jobs · scope · exclusions</text>
      <text x="88" y="540">Raises the one question that matters</text>
      <text x="478" y="516">Style shortlist · screens · states</text>
      <text x="478" y="540">Scenarios · asset and test plans</text>
      <text x="868" y="516">Native iOS code · vertical flow</text>
      <text x="868" y="540">Fixes defects, never self-accepts</text>
      <text x="283" y="779">Product imagery · icon · ASO</text>
      <text x="673" y="779">Build · Simulator · interaction · visuals</text>
    </g>
  </g>
</svg>
