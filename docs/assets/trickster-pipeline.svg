<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="590" viewBox="0 0 1280 590" role="img" aria-labelledby="title desc">
  <title id="title">Trickster app production pipeline</title>
  <desc id="desc">Four phases lead from a product idea to a delivered native iOS app: define, choose one style, build, and independently verify.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#77736C"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1280" height="590" rx="36" fill="#F5F2EA"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="74" fill="#11100F" font-size="38" font-weight="760" letter-spacing="-1.2">One controlled path to a native iOS app</text>
    <text x="64" y="110" fill="#6D6961" font-size="20">The master moves the product through four clear phases.</text>

    <g fill="none" stroke="#77736C" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)">
      <path d="M326 292H353"/>
      <path d="M618 292H645"/>
      <path d="M910 292H937"/>
    </g>

    <g filter="url(#shadow)">
      <rect x="64" y="176" width="262" height="232" rx="26" fill="#FFFFFF"/>
      <rect x="356" y="176" width="262" height="232" rx="26" fill="#11100F"/>
      <rect x="648" y="176" width="262" height="232" rx="26" fill="#FFFFFF"/>
      <rect x="940" y="176" width="276" height="232" rx="26" fill="#149E87"/>
    </g>

    <g font-size="15" font-weight="760" letter-spacing="1.8">
      <text x="92" y="218" fill="#8A857C">DEFINE</text>
      <text x="384" y="218" fill="#149E87">CHOOSE</text>
      <text x="676" y="218" fill="#8A857C">BUILD</text>
      <text x="968" y="218" fill="#11100F">VERIFY</text>
    </g>

    <g font-size="27" font-weight="750" letter-spacing="-0.5">
      <text x="92" y="266" fill="#11100F">Shape the product</text>
      <text x="384" y="266" fill="#FAF8F2">Confirm one style</text>
      <text x="676" y="266" fill="#11100F">Make the app</text>
      <text x="968" y="266" fill="#11100F">Prove and deliver</text>
    </g>

    <g font-size="18">
      <text x="92" y="310" fill="#6D6961">Scope and contract</text>
      <text x="92" y="340" fill="#6D6961">before UI work</text>

      <text x="384" y="310" fill="#B9B5AC">One local package</text>
      <text x="384" y="340" fill="#B9B5AC">selected by the user</text>

      <text x="676" y="310" fill="#6D6961">Native implementation,</text>
      <text x="676" y="340" fill="#6D6961">assets and app icon</text>

      <text x="968" y="310" fill="#11100F">Independent Simulator</text>
      <text x="968" y="340" fill="#11100F">acceptance and ASO</text>
    </g>

    <g>
      <rect x="64" y="466" width="1152" height="68" rx="20" fill="#E9E5DC"/>
      <circle cx="100" cy="500" r="9" fill="#11100F"/>
      <text x="124" y="507" fill="#4D4B45" font-size="18" font-weight="650">No UI before style confirmation</text>
      <circle cx="475" cy="500" r="9" fill="#11100F"/>
      <text x="499" y="507" fill="#4D4B45" font-size="18" font-weight="650">The builder cannot accept its own work</text>
      <circle cx="905" cy="500" r="9" fill="#11100F"/>
      <text x="929" y="507" fill="#4D4B45" font-size="18" font-weight="650">Evidence ships with the result</text>
    </g>
  </g>
</svg>
