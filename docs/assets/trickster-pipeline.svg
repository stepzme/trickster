<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc">
  <title id="title">Trickster app production pipeline</title>
  <desc id="desc">A clean four-stage timeline: define the product, confirm one style, build the native app, then independently verify and deliver it.</desc>
  <rect width="1280" height="500" rx="36" fill="#F5F2EA"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(576 46)">
      <rect width="128" height="30" rx="15" fill="#E8E4DB"/>
      <circle cx="20" cy="15" r="4" fill="#149E87"/>
      <text x="34" y="20" fill="#6D6961" font-size="12" font-weight="700" letter-spacing="1.6">PROCESS</text>
    </g>
    <text x="640" y="128" fill="#11100F" font-size="40" font-weight="760" letter-spacing="-1.4" text-anchor="middle">From idea to accepted iOS app</text>
    <text x="640" y="163" fill="#6D6961" font-size="18" text-anchor="middle">One direction, four controlled phases.</text>

    <line x1="112" y1="358" x2="1168" y2="358" stroke="#C9C5BC" stroke-width="2"/>

    <g fill="none" stroke="#C9C5BC" stroke-width="2">
      <line x1="160" y1="306" x2="160" y2="350"/>
      <line x1="480" y1="306" x2="480" y2="350"/>
      <line x1="800" y1="306" x2="800" y2="350"/>
      <line x1="1120" y1="306" x2="1120" y2="350"/>
    </g>

    <g text-anchor="middle">
      <g transform="translate(160 0)">
        <text y="220" fill="#149E87" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">01</text>
        <text y="258" fill="#11100F" font-size="24" font-weight="720">Shape the product</text>
        <text y="289" fill="#6D6961" font-size="16">Scope and contract</text>
      </g>

      <g transform="translate(480 0)">
        <text y="220" fill="#149E87" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">02</text>
        <text y="258" fill="#11100F" font-size="24" font-weight="720">Confirm one style</text>
        <text y="289" fill="#6D6961" font-size="16">One package, selected by you</text>
      </g>

      <g transform="translate(800 0)">
        <text y="220" fill="#149E87" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">03</text>
        <text y="258" fill="#11100F" font-size="24" font-weight="720">Build the native app</text>
        <text y="289" fill="#6D6961" font-size="16">Implementation, assets, app icon</text>
      </g>

      <g transform="translate(1120 0)">
        <text y="220" fill="#149E87" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">04</text>
        <text y="258" fill="#11100F" font-size="24" font-weight="720">Verify and deliver</text>
        <text y="289" fill="#6D6961" font-size="16">Independent acceptance and ASO</text>
      </g>
    </g>

    <g>
      <circle cx="160" cy="358" r="7" fill="#11100F"/>
      <circle cx="480" cy="358" r="7" fill="#11100F"/>
      <circle cx="800" cy="358" r="7" fill="#11100F"/>
      <circle cx="1120" cy="358" r="13" fill="#F5F2EA" stroke="#149E87" stroke-width="3"/>
      <circle cx="1120" cy="358" r="5" fill="#149E87"/>
    </g>

    <text x="160" y="407" fill="#8A857C" font-size="13" font-weight="650" text-anchor="middle">DEFINED</text>
    <text x="480" y="407" fill="#8A857C" font-size="13" font-weight="650" text-anchor="middle">CONFIRMED</text>
    <text x="800" y="407" fill="#8A857C" font-size="13" font-weight="650" text-anchor="middle">BUILT</text>
    <text x="1120" y="407" fill="#149E87" font-size="13" font-weight="750" text-anchor="middle">ACCEPTED</text>
  </g>
</svg>
